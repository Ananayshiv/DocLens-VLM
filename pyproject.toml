[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doclens-vlm"
version = "0.1.0"
description = "Visual document retrieval, page-grounded VLM answers and Indic document evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10", "PyMuPDF>=1.23", "torch>=2.1", "gradio>=4.0", "pytesseract>=0.3.10"]

[project.optional-dependencies]
vision = ["colpali-engine>=0.3.5", "transformers>=4.48,<5", "accelerate>=0.30", "sentencepiece>=0.2"]
evaluation = ["datasets>=3.0", "pyarrow>=16"]
tests = ["pytest>=8"]

[project.scripts]
doclens = "doclens.cli:main"

[tool.setuptools.packages.find]
include = ["doclens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
